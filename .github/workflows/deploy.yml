name: deploy
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium + CJK/emoji fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser fonts-noto-cjk fonts-noto-color-emoji
      - name: Build site + print docs
        run: |
          cd src
          python build.py
          python build_print.py --lang zh
          python build_print.py --lang en
      - name: Render PDFs
        run: |
          chromium-browser --headless=new --no-pdf-header-footer \
            --print-to-pdf=agentscope-visual-guide-zh.pdf \
            --virtual-time-budget=20000 "file://$PWD/print.zh.html"
          chromium-browser --headless=new --no-pdf-header-footer \
            --print-to-pdf=agentscope-visual-guide-en.pdf \
            --virtual-time-budget=20000 "file://$PWD/print.en.html"
      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/lessons
          cp index.html _site/
          cp -r lessons/* _site/lessons/
          cp agentscope-visual-guide-zh.pdf agentscope-visual-guide-en.pdf _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Release PDFs on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agentscope-visual-guide-zh.pdf
            agentscope-visual-guide-en.pdf
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
