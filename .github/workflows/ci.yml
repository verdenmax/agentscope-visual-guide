name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild site and check for drift
        run: |
          cd src && python build.py
          cd ..
          git diff --exit-code -- index.html lessons/ \
            || (echo "::error::Committed HTML is stale; run 'cd src && python build.py'" && exit 1)
      - name: Link check
        run: cd src && python check_links.py
      - name: HTML structure check
        run: cd src && python check_html.py
